# Build the site with projection and publish it to the gh-pages branch on every push to master.
# Pages already serves gh-pages, so `projection deploy` from the admin UI still works too.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: portfolio

      # projection's master, the same code `projection` runs locally (npm link to ~/GitHub/projection).
      - uses: actions/checkout@v4
        with:
          repository: quasarbright/projection
          path: projection

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projection/package-lock.json

      - name: Build projection
        working-directory: projection
        run: |
          npm ci
          npx tsc
          npm run copy-templates

      - name: Build site
        working-directory: portfolio
        run: node ../projection/bin/projection.js build --output dist

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: portfolio/dist
          publish_branch: gh-pages
          commit_message: Deploy ${{ github.sha }}
